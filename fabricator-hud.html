<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fabricator HUD</title>
  <style>
    :root {
      --bg: #030b14;
      --bg2: #06172c;
      --panel: rgba(11, 28, 45, 0.72);
      --panel-strong: rgba(12, 31, 56, 0.9);
      --line: rgba(96, 226, 255, 0.8);
      --line-soft: rgba(96, 226, 255, 0.35);
      --glow: rgba(96, 226, 255, 0.95);
      --text: #dffbff;
      --text-dim: rgba(175, 232, 255, 0.75);
      --accent: #7df9ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at center, rgba(23, 43, 65, 0.8), rgba(2, 8, 18, 0.96) 46%, rgba(0,0,0,1) 72%),
        linear-gradient(180deg, #040b13 0%, #01070d 100%);
      overflow: hidden;
      color: var(--text);
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.03), rgba(255,255,255,0.01)),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.04),
          rgba(255,255,255,0.04) 1px,
          transparent 1px,
          transparent 3px
        );
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.5;
    }

    .hud {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scan-ring {
      position: absolute;
      inset: 8% 18%;
      border: 1px solid rgba(117, 230, 255, 0.5);
      border-radius: 50%;
      box-shadow:
        0 0 18px rgba(96, 226, 255, 0.3),
        inset 0 0 18px rgba(96, 226, 255, 0.16);
      opacity: 0.5;
    }

    .scan-ring::before,
    .scan-ring::after {
      content: "";
      position: absolute;
      inset: 10%;
      border: 1px solid rgba(117, 230, 255, 0.4);
      border-radius: 50%;
    }

    .scan-ring::after {
      inset: 20%;
    }

    .crosshair {
      position: absolute;
      width: 55vmin;
      height: 55vmin;
      border: 1px solid rgba(118, 233, 255, 0.5);
      border-radius: 50%;
      box-shadow: inset 0 0 22px rgba(96, 226, 255, 0.2);
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: linear-gradient(90deg, transparent, rgba(124, 231, 255, 0.8), transparent);
      box-shadow: 0 0 12px rgba(96, 226, 255, 0.8);
    }

    .crosshair::before {
      left: 50%;
      top: -12%;
      width: 1px;
      height: 124%;
      transform: translateX(-50%);
    }

    .crosshair::after {
      top: 50%;
      left: -12%;
      width: 124%;
      height: 1px;
      transform: translateY(-50%);
    }

    .holo-body {
      position: relative;
      width: min(34vw, 350px);
      height: min(58vw, 560px);
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 12px rgba(116, 233, 255, 0.45));
      z-index: 3;
    }

    .silhouette {
      position: relative;
      width: 100%;
      height: 100%;
      opacity: 0.9;
    }

    .silhouette svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .silhouette .line {
      fill: none;
      stroke: rgba(128, 233, 255, 0.95);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 8px rgba(117, 230, 255, 0.9));
    }

    .silhouette .glow {
      fill: none;
      stroke: rgba(192, 248, 255, 0.16);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .data-panel {
      position: absolute;
      width: 220px;
      padding: 14px 16px 12px;
      background: rgba(9, 24, 38, 0.48);
      border: 1px solid rgba(117, 230, 255, 0.4);
      box-shadow:
        inset 0 0 16px rgba(96, 226, 255, 0.12),
        0 0 16px rgba(96, 226, 255, 0.12);
      z-index: 4;
      backdrop-filter: blur(2px);
    }

    .data-panel::before, .data-panel::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(117, 230, 255, 0.08);
      pointer-events: none;
    }

    .data-panel.left {
      left: 7%;
      top: 17%;
      transform: translateY(-50%);
    }

    .data-panel.right {
      right: 7%;
      top: 26%;
      transform: translateY(-50%);
    }

    .bottom-panel {
      position: absolute;
      left: 50%;
      bottom: 7%;
      width: min(72vw, 680px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      z-index: 4;
    }

    .status-box {
      background: rgba(9, 24, 38, 0.42);
      border: 1px solid rgba(117, 230, 255, 0.35);
      min-height: 75px;
      padding: 10px 14px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 18px rgba(96, 226, 255, 0.09);
    }

    .status-box::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(117, 230, 255, 0.12);
    }

    .brand {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      text-align: center;
      letter-spacing: 0.3em;
      color: rgba(200, 240, 255, 0.8);
      font-size: 10px;
      text-transform: uppercase;
    }

    .brand strong {
      display: block;
      font-size: 20px;
      letter-spacing: 0.18em;
      font-weight: 600;
      color: var(--text);
      text-shadow: 0 0 12px rgba(125, 249, 255, 0.8);
    }

    .readout {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .readout strong {
      display: block;
      font-size: 16px;
      letter-spacing: 0.08em;
      color: var(--text);
      margin-top: 4px;
      text-shadow: 0 0 10px rgba(125, 249, 255, 0.7);
    }

    .bar {
      width: 100%;
      height: 8px;
      border: 1px solid rgba(117, 230, 255, 0.45);
      position: relative;
      overflow: hidden;
      background: rgba(8, 16, 25, 0.7);
      box-shadow: inset 0 0 12px rgba(96, 226, 255, 0.06);
    }

    .bar > span {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 72%;
      background: linear-gradient(90deg, rgba(105, 191, 255, 0.2), rgba(101, 245, 255, 0.9));
      box-shadow: 0 0 12px rgba(87, 218, 255, 0.8);
    }

    .tiny {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(172, 231, 255, 0.75);
    }

    .small-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(172, 231, 255, 0.75);
      margin-bottom: 8px;
    }

    .center-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 180px;
    }

    .radar {
      position: absolute;
      right: 8%;
      top: 38%;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(117, 230, 255, 0.35);
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(117, 230, 255, 0.06), rgba(0,0,0,0) 52%),
        repeating-radial-gradient(circle, rgba(117, 230, 255, 0.15) 0 1px, transparent 1px 24px);
      box-shadow: inset 0 0 18px rgba(96, 226, 255, 0.18);
      overflow: hidden;
      z-index: 2;
    }

    .radar::before,
    .radar::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .radar::before {
      background: conic-gradient(from 180deg, transparent 0deg, rgba(128,233,255,0.24) 80deg, transparent 160deg, transparent 360deg);
      animation: spin 8s linear infinite;
    }

    .radar::after {
      inset: 18px;
      border: 1px solid rgba(117, 230, 255, 0.35);
      background: radial-gradient(circle at center, rgba(117, 230, 255, 0.08), rgba(0,0,0,0) 58%);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulses {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at center, transparent 0 60%, rgba(117, 230, 255, 0.12) 60% 72%, transparent 72% 100%);
      opacity: 0.75;
      animation: pulse 2.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    @media (max-width: 900px) {
      .data-panel.left { left: 3%; }
      .data-panel.right { right: 3%; }
      .bottom-panel { width: 88vw; }
      .holo-body { width: min(52vw, 300px); }
    }

    @media (max-width: 640px) {
      .brand { top: 4%; letter-spacing: 0.2em; }
      .brand strong { letter-spacing: 0.1em; font-size: 18px; }
      .data-panel {
        width: 150px;
        padding: 10px 10px 8px;
      }
      .readout { gap: 8px; font-size: 8px; }
      .readout strong { font-size: 12px; }
      .bottom-panel { grid-template-columns: 1fr; width: 66vw; }
      .center-info { min-width: 0; }
    }
  </style>
</head>
<body>

    <div class="brand">
      <span>Fabrication Network</span>
      <strong>FAB-01</strong>
    </div>

    <div class="scan-ring"></div>
