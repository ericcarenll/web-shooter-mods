<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Shooter Reference Match</title>
  <style>
    :root {
      --bg-1: #7e5b42;
      --bg-2: #3a2c24;
      --bg-3: #1e1a1a;
      --metal-1: #e5e7ea;
      --metal-2: #afb3b9;
      --metal-3: #7c7f85;
      --metal-4: #4d5055;
      --red-1: #ea3f48;
      --red-2: #a9141f;
      --red-3: #6b0d13;
      --dark: rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,0.22), rgba(126,91,66,0) 24%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 38%, var(--bg-3) 100%);
      font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.08));
      pointer-events: none;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
    }

    .device {
      position: relative;
      width: min(82vw, 760px);
      height: min(52vw, 430px);
      transform: rotate(-5deg) rotateX(10deg) scale(1.06);
      filter: drop-shadow(0 20px 20px rgba(0,0,0,0.52));
    }

    .wrist-shadow {
      position: absolute;
      left: 50%;
      bottom: 4%;
      width: 74%;
      height: 18%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(0,0,0,0.46), rgba(0,0,0,0.08) 62%, transparent 100%);
      filter: blur(8px);
      opacity: 0.8;
    }

    .outer-shell {
      position: absolute;
      left: 50%;
      top: 53%;
      width: 78%;
      height: 56%;
      transform: translate(-50%, -50%);
      border-radius: 18px 18px 26px 26px;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(0,0,0,0.08));
      box-shadow: inset 0 0 16px rgba(255,255,255,0.18);
    }

    .frame {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 72%;
      height: 48%;
      transform: translate(-50%, -50%);
      border-radius: 16px 16px 20px 20px;
      background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 18%, var(--metal-1) 35%, var(--metal-3) 100%);
      border: 2px solid rgba(72,74,79,0.9);
      box-shadow:
        inset 0 8px 12px rgba(255,255,255,0.36),
        inset 0 -10px 12px rgba(0,0,0,0.18),
        0 8px 14px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      top: 12%;
      width: 40px;
      height: 74%;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(0,0,0,0.15));
      border: 1px solid rgba(67,69,73,0.8);
    }

    .frame::before { left: 16px; }
    .frame::after { right: 16px; }

    .plate {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 62%;
      height: 26%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(0,0,0,0.1));
      border: 1px solid rgba(72,75,80,0.8);
      border-radius: 12px;
      z-index: 2;
    }

    .metal-strip {
      position: absolute;
      left: 50%;
      width: 74%;
      height: 8%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(140,143,150,0.9), rgba(78,80,86,0.96));
      border-radius: 999px;
      box-shadow: inset 0 3px 5px rgba(255,255,255,0.26), inset 0 -4px 5px rgba(0,0,0,0.25);
      z-index: 3;
    }

    .metal-strip.top { top: 30%; }
    .metal-strip.bottom { top: 70%; }

    .barrel-bank {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 64%;
      height: 35%;
      transform: translate(-50%, -50%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7%;
      z-index: 6;
    }

    .barrel {
      position: relative;
      background: linear-gradient(180deg, #f3f4f6 0%, #c3c6cc 18%, #757b82 52%, #e4e6ea 100%);
      border-radius: 18px 18px 12px 12px;
      border: 2px solid rgba(60,63,68,0.9);
      box-shadow:
        inset 0 8px 10px rgba(255,255,255,0.35),
        inset 0 -9px 10px rgba(0,0,0,0.14),
        0 8px 12px rgba(0,0,0,0.14);
      overflow: hidden;
    }

    .barrel::before {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 16%;
      height: 12%;
      border-radius: 8px;
      background: rgba(67,70,75,0.8);
    }

    .barrel::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9%;
      width: 74%;
      height: 18%;
      transform: translateX(-50%);
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(92,95,100,0.82), rgba(27,30,33,0.96));
    }

    .tube-bank {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 66%;
      height: 18%;
      transform: translate(-50%, -50%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9%;
      z-index: 7;
    }

    .tube {
      position: relative;
      background: linear-gradient(180deg, #f7595f 0%, var(--red-1) 30%, var(--red-2) 100%);
      border-radius: 999px;
      box-shadow:
        inset 0 2px 8px rgba(255,255,255,0.18),
        inset 0 -5px 10px rgba(0,0,0,0.28),
        0 0 10px rgba(255, 95, 110, 0.2);
    }

    .tube::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12%;
      height: 64%;
      transform: translate(-50%, -50%);
      background: rgba(74,0,0,0.2);
      border-radius: 999px;
    }

    .tube::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 76%;
      height: 18%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
    }

    .screw-row {
      position: absolute;
      left: 50%;
      bottom: 12%;
      width: 56%;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      z-index: 9;
    }

    .screw {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #50565b 0%, #171b1d 35%, #090b0d 100%);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: inset 0 2px 2px rgba(255,255,255,0.18), 0 2px 3px rgba(0,0,0,0.22);
    }

    .strap {
      position: absolute;
      left: 50%;
      top: 71%;
      width: 42%;
      height: 9%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(38,41,44,0.9), rgba(17,19,22,0.98));
      border-radius: 8px;
      box-shadow: inset 0 3px 5px rgba(255,255,255,0.1), inset 0 -5px 6px rgba(0,0,0,0.2);
      z-index: 3;
    }

    .strap::before {
      content: "";
      position: absolute;
      inset: 12% 8%;
      border-radius: 8px;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.04),
        rgba(255,255,255,0.04) 2px,
        transparent 2px,
        transparent 8px
      );
      opacity: 0.6;
    }

    .grip {
      position: absolute;
      left: 50%;
      bottom: 11%;
      width: 20%;
      height: 16%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(82,85,90,0.9), rgba(33,37,40,1));
      border-radius: 12px;
      box-shadow:
        inset 0 6px 10px rgba(255,255,255,0.12),
        inset 0 -10px 12px rgba(0,0,0,0.28),
        0 10px 12px rgba(0,0,0,0.18);
      z-index: 2;
    }

    .grip::before {
      content: "";
      position: absolute;
      inset: 8% 12%;
      border-radius: 10px;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 4px,
        transparent 4px,
        transparent 9px
      );
    }

    .trigger {
      position: absolute;
      left: 64%;
      top: 51%;
      width: 12px;
      height: 54px;
      background: linear-gradient(180deg, #656a70 0%, #2a2d30 100%);
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.45);
      transform: rotate(-18deg);
      box-shadow: inset 0 0 4px rgba(255,255,255,0.14);
      z-index: 10;
    }

    .trigger::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 10%;
      width: 200%;
      height: 18%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
    }

    .shadow-base {
      position: absolute;
      left: 50%;
      bottom: 2%;
      width: 17%;
      height: 8%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(0,0,0,0.35), rgba(0,0,0,0.08) 62%, transparent 100%);
      filter: blur(12px);
      opacity: 0.7;
    }

    @media (max-width: 700px) {
      .device {
        width: min(90vw, 540px);
        height: min(62vw, 360px);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="device" aria-label="Web shooter reference model">
      <div class="wrist-shadow"></div>
      <div class="outer-shell"></div>
      <div class="frame"></div>
      <div class="plate"></div>
      <div class="metal-strip top"></div>
      <div class="metal-strip bottom"></div>

      <div class="barrel-bank">
        <div class="barrel"></div>
        <div class="barrel"></div>
        <div class="barrel"></div>
        <div class="barrel"></div>
      </div>

      <div class="tube-bank">
        <div class="tube"></div>
        <div class="tube"></div>
        <div class="tube"></div>
        <div class="tube"></div>
      </div>

      <div class="strap"></div>
      <div class="grip"></div>
      <div class="trigger"></div>

      <div class="screw-row">
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
      </div>

      <div class="shadow-base"></div>
    </div>
  </div>
</body>
</html>
