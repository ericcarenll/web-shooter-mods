<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Shooter Model</title>
  <style>
    :root {
      --bg-1: #8b6a4b;
      --bg-2: #4b382a;
      --metal-1: #d8d8d8;
      --metal-2: #a6a6a8;
      --metal-3: #7a7a7e;
      --metal-4: #4d4f54;
      --red-1: #d92a2f;
      --red-2: #a9161d;
      --shadow: rgba(0,0,0,0.4);
      --screw: #2a2a2d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,0.18), transparent 24%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 48%, #2f241d 100%);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .device {
      position: relative;
      width: min(82vw, 720px);
      height: min(58vw, 460px);
      transform: rotate(-5deg) scale(1.05);
      filter: drop-shadow(0 18px 18px rgba(0,0,0,0.45));
    }

    .base {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 84%;
      height: 56%;
      transform: translate(-50%, -50%);
      border-radius: 16px 16px 18px 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(0,0,0,0.1));
      box-shadow: inset 0 0 12px rgba(255,255,255,0.18);
    }

    .frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 78%;
      height: 48%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 18%, var(--metal-1) 40%, var(--metal-3) 100%);
      border-radius: 16px 16px 14px 14px;
      border: 2px solid rgba(78, 80, 86, 0.7);
      box-shadow:
        inset 0 6px 10px rgba(255,255,255,0.45),
        inset 0 -8px 10px rgba(0,0,0,0.2),
        0 8px 12px rgba(0,0,0,0.2);
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      top: 12%;
      width: 42px;
      height: 76%;
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(0,0,0,0.18));
      border-radius: 8px;
      border: 1px solid rgba(70,70,72,0.7);
    }

    .frame::before { left: 18px; }
    .frame::after { right: 18px; }

    .barrel-group {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 66%;
      height: 36%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8%;
    }

    .barrel {
      position: relative;
      width: 18%;
      height: 100%;
      background: linear-gradient(180deg, #f4f4f4 0%, #bdbec1 14%, #7d7f84 45%, #dbdce1 100%);
      border-radius: 18px 18px 12px 12px;
      border: 2px solid rgba(58, 60, 64, 0.9);
      box-shadow:
        inset 0 10px 10px rgba(255,255,255,0.4),
        inset 0 -8px 10px rgba(0,0,0,0.12),
        0 8px 12px rgba(0,0,0,0.18);
    }

    .barrel::before {
      content: "";
      position: absolute;
      width: 96%;
      height: 10%;
      left: 2%;
      top: 16%;
      border-radius: 8px;
      background: rgba(70, 72, 75, 0.8);
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.2);
    }

    .barrel::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8%;
      width: 78%;
      height: 16%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(92,94,100,0.8), rgba(30,32,36,0.9));
      border-radius: 8px;
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.2);
    }

    .tubing {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 70%;
      height: 25%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10%;
      z-index: 3;
    }

    .tube {
      position: relative;
      width: 21%;
      height: 100%;
      background: linear-gradient(180deg, #ff5b62 0%, var(--red-1) 35%, var(--red-2) 100%);
      border-radius: 999px;
      box-shadow:
        inset 0 2px 8px rgba(255,255,255,0.2),
        inset 0 -4px 10px rgba(0,0,0,0.28),
        0 0 8px rgba(255,82,99,0.33);
    }

    .tube::before,
    .tube::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 12%;
      height: 100%;
      border-radius: 999px;
      background: rgba(80, 0, 0, 0.2);
    }

    .tube::after {
      width: 80%;
      height: 18%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
    }

    .buttons {
      position: absolute;
      left: 50%;
      bottom: 11%;
      width: 60%;
      height: 12%;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }

    .screw {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4d5258 0%, #1a1d1f 35%, #05070a 100%);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.16), 0 2px 4px rgba(0,0,0,0.25);
    }

    .screw::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }

    .rod {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 77%;
      height: 10%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, rgba(136,136,136,0.9), rgba(90,90,92,0.95));
      border-radius: 12px;
      box-shadow: inset 0 3px 5px rgba(255,255,255,0.3), inset 0 -4px 8px rgba(0,0,0,0.3);
      z-index: 2;
    }

    .rod::before,
    .rod::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 10%;
      height: 1px;
      background: rgba(40,40,42,0.7);
      transform: translateY(-50%);
    }

    .rod::before { left: 8%; }
    .rod::after { right: 8%; }

    .side-bar {
      position: absolute;
      width: 74%;
      height: 8%;
      left: 13%;
      top: 24%;
      background: linear-gradient(90deg, rgba(136,136,136,0.8), rgba(255,255,255,0.3), rgba(136,136,136,0.8));
      border-radius: 999px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.15), inset 0 -3px 5px rgba(0,0,0,0.2);
      z-index: 4;
    }

    .side-bar.bottom {
      top: 68%;
    }

    .inner-plate {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 62%;
      height: 22%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(0,0,0,0.08));
      border: 1px solid rgba(62,63,66,0.7);
      border-radius: 10px;
      z-index: 1;
    }

    .grip-shadow {
      position: absolute;
      left: 50%;
      top: 58%;
      width: 68%;
      height: 12%;
      transform: translate(-50%, 0);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.42));
      filter: blur(12px);
      opacity: 0.65;
      z-index: 0;
    }

    @media (max-width: 700px) {
      .device {
        width: min(90vw, 540px);
        height: min(70vw, 440px);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="device" aria-label="Web shooter model">
      <div class="base"></div>
      <div class="frame"></div>
      <div class="rod"></div>
      <div class="inner-plate"></div>
      <div class="side-bar"></div>
      <div class="side-bar bottom"></div>

      <div class="barrel-group">
        <div class="barrel"></div>
        <div class="barrel"></div>
        <div class="barrel"></div>
        <div class="barrel"></div>
      </div>

      <div class="tubing">
        <div class="tube"></div>
        <div class="tube"></div>
        <div class="tube"></div>
        <div class="tube"></div>
      </div>

      <div class="buttons">
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
      </div>

      <div class="grip-shadow"></div>
    </div>
  </div>
</body>
</html>
