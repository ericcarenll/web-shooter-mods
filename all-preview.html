<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Fabricator + Web Shooter</title>
  <style>
    :root {
      --bg-1: #020914;
      --bg-2: #071a2c;
      --panel: rgba(9, 24, 36, 0.78);
      --panel-strong: rgba(12, 32, 48, 0.92);
      --line: rgba(118, 235, 255, 0.9);
      --line-soft: rgba(118, 235, 255, 0.26);
      --text: #eafcff;
      --muted: rgba(196, 231, 255, 0.76);
      --metal-1: #ebedf0;
      --metal-2: #b5bac1;
      --metal-3: #7d8087;
      --metal-4: #4d5057;
      --red-1: #ff4a5d;
      --red-2: #af1d2c;
      --red-3: #6d1119;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 20%, rgba(18, 55, 82, 0.95), rgba(2, 9, 18, 0.98) 42%, rgba(0, 0, 0, 1) 100%),
        linear-gradient(180deg, #020913 0%, #00070d 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.03), rgba(255,255,255,0.01)),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.025),
          rgba(255,255,255,0.025) 1px,
          transparent 1px,
          transparent 3px
        );
      pointer-events: none;
      opacity: 0.7;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1.35fr 0.95fr;
      gap: 20px;
      padding: 18px;
      z-index: 2;
    }

    .panel {
      position: relative;
      background: linear-gradient(180deg, rgba(9, 21, 33, 0.8), rgba(4, 12, 20, 0.95));
      border: 1px solid rgba(118, 235, 255, 0.42);
      box-shadow:
        inset 0 0 18px rgba(118, 235, 255, 0.08),
        0 0 28px rgba(118, 235, 255, 0.08);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(118, 235, 255, 0.08);
      pointer-events: none;
    }

    .hud-panel {
      position: relative;
      min-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 10px;
      color: rgba(208, 235, 255, 0.74);
      z-index: 20;
    }

    .brand strong {
      display: block;
      margin-top: 8px;
      font-size: 22px;
      letter-spacing: 0.18em;
      color: var(--text);
      text-shadow: 0 0 16px rgba(118, 235, 255, 0.85);
    }

    .scan-ring {
      position: absolute;
      inset: 10% 13%;
      border: 1px solid rgba(118, 235, 255, 0.46);
      border-radius: 50%;
      box-shadow:
        inset 0 0 22px rgba(118, 235, 255, 0.1),
        0 0 18px rgba(118, 235, 255, 0.08);
      z-index: 1;
    }

    .scan-ring::before,
    .scan-ring::after {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px solid rgba(118, 235, 255, 0.25);
    }

    .scan-ring::after {
      inset: 20%;
    }

    .crosshair {
      position: absolute;
      width: min(56vw, 680px);
      height: min(56vw, 680px);
      border: 1px solid rgba(118, 235, 255, 0.18);
      border-radius: 50%;
      box-shadow: inset 0 0 26px rgba(118, 235, 255, 0.06);
      z-index: 2;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: linear-gradient(90deg, transparent, rgba(118, 235, 255, 0.7), transparent);
      box-shadow: 0 0 12px rgba(118, 235, 255, 0.5);
    }

    .crosshair::before {
      top: 50%;
      left: -8%;
      width: 116%;
      height: 1px;
      transform: translateY(-50%);
    }

    .crosshair::after {
      top: -8%;
      left: 50%;
      width: 1px;
      height: 116%;
      transform: translateX(-50%);
    }

    .holo-body {
      position: relative;
      width: min(36vw, 380px);
      height: min(62vw, 660px);
      z-index: 5;
      filter: drop-shadow(0 0 20px rgba(118, 235, 255, 0.35));
    }

    .holo-body svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .glow {
      fill: none;
      stroke: rgba(118, 235, 255, 0.18);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .line {
      fill: none;
      stroke: rgba(118, 235, 255, 0.95);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(118, 235, 255, 0.8));
    }

    .side-panel {
      position: absolute;
      width: 210px;
      padding: 14px 16px 12px;
      background: rgba(9, 24, 38, 0.45);
      border: 1px solid rgba(118, 235, 255, 0.38);
      box-shadow: inset 0 0 18px rgba(118, 235, 255, 0.08);
      z-index: 12;
    }

    .side-panel::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(118, 235, 255, 0.08);
      pointer-events: none;
    }

    .side-panel.left { left: 6%; top: 18%; }
    .side-panel.right { right: 7%; top: 28%; }

    .label {
      margin-bottom: 12px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(208, 235, 255, 0.7);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(208, 235, 255, 0.75);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .stats strong {
      display: block;
      margin-top: 5px;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--text);
      text-shadow: 0 0 10px rgba(118, 235, 255, 0.75);
    }

    .meter {
      position: relative;
      width: 100%;
      height: 8px;
      margin-top: 12px;
      border: 1px solid rgba(118, 235, 255, 0.42);
      background: rgba(10, 20, 30, 0.8);
      overflow: hidden;
    }

    .meter span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 72%;
      background: linear-gradient(90deg, rgba(118, 235, 255, 0.16), rgba(118, 235, 255, 0.9));
      box-shadow: 0 0 10px rgba(118, 235, 255, 0.75);
    }

    .radar {
      position: absolute;
      right: 9%;
      top: 38%;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid rgba(118, 235, 255, 0.35);
      background:
        radial-gradient(circle at center, rgba(118, 235, 255, 0.08), rgba(0,0,0,0) 55%),
        repeating-radial-gradient(circle, rgba(118, 235, 255, 0.14) 0 1px, transparent 1px 22px);
      box-shadow: inset 0 0 18px rgba(118, 235, 255, 0.12);
      overflow: hidden;
      z-index: 3;
    }

    .radar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 180deg, transparent 0deg, rgba(118, 235, 255, 0.24) 80deg, transparent 160deg, transparent 360deg);
      animation: spin 8s linear infinite;
    }

    .radar::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(118, 235, 255, 0.34);
      background: radial-gradient(circle at center, rgba(118, 235, 255, 0.1), rgba(0,0,0,0) 62%);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .bottom-bar {
      position: absolute;
      left: 50%;
      bottom: 24px;
      width: min(75vw, 700px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      z-index: 20;
    }

    .mini-box {
      position: relative;
      min-height: 86px;
      background: rgba(9, 25, 36, 0.48);
      border: 1px solid rgba(118, 235, 255, 0.32);
      box-shadow: inset 0 0 18px rgba(118, 235, 255, 0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 16px;
    }

    .mini-box::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(118, 235, 255, 0.08);
    }

    .mini-box .name {
      display: block;
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(208, 235, 255, 0.72);
      margin-bottom: 8px;
    }

    .mini-box .value {
      display: block;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 10px rgba(118, 235, 255, 0.7);
    }

    .shooter-panel {
      position: relative;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(9, 18, 28, 0.75), rgba(5, 10, 16, 0.96));
    }

    .shooter-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(20, 52, 70, 0.54), rgba(7, 12, 18, 0.88) 56%, rgba(0,0,0,1) 100%);
      border: 1px solid rgba(118, 235, 255, 0.2);
      overflow: hidden;
    }

    .shooter-scene::before {
      content: "";
      position: absolute;
      inset: 11% 15%;
      border-radius: 50%;
      border: 1px solid rgba(118, 235, 255, 0.18);
      box-shadow: inset 0 0 22px rgba(118, 235, 255, 0.08);
    }

    .s-body {
      position: relative;
      width: min(62vw, 440px);
      height: min(48vw, 320px);
      transform: rotate(-5deg) scale(1.06);
      filter: drop-shadow(0 18px 18px rgba(0,0,0,0.5));
    }

    .s-frame {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 78%;
      height: 46%;
      transform: translate(-50%, -50%);
      border-radius: 18px 18px 22px 22px;
      background: linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 18%, var(--metal-1) 35%, var(--metal-3) 100%);
      border: 2px solid rgba(72,74,79,0.9);
      box-shadow: inset 0 8px 12px rgba(255,255,255,0.36), inset 0 -10px 12px rgba(0,0,0,0.18), 0 8px 14px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .s-frame::before, .s-frame::after {
      content: "";
      position: absolute;
      top: 12%;
      width: 40px;
      height: 74%;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(0,0,0,0.15));
      border: 1px solid rgba(67,69,73,0.8);
    }

    .s-frame::before { left: 16px; }
    .s-frame::after { right: 16px; }

    .s-plate {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 62%;
      height: 26%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(0,0,0,0.1));
      border: 1px solid rgba(72,75,80,0.8);
      border-radius: 12px;
      z-index: 2;
    }

    .s-strip {
      position: absolute;
      left: 50%;
      width: 74%;
      height: 8%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(140,143,150,0.9), rgba(78,80,86,0.96));
      border-radius: 999px;
      z-index: 3;
    }

    .s-strip.top { top: 30%; }
    .s-strip.bottom { top: 70%; }

    .s-bank {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 64%;
      height: 35%;
      transform: translate(-50%, -50%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7%;
      z-index: 5;
    }

    .s-barrel {
      background: linear-gradient(180deg, #f3f4f6 0%, #c3c6cc 18%, #757b82 52%, #e4e6ea 100%);
      border-radius: 18px 18px 12px 12px;
      border: 2px solid rgba(60,63,68,0.9);
      box-shadow: inset 0 8px 10px rgba(255,255,255,0.35), inset 0 -9px 10px rgba(0,0,0,0.14), 0 8px 12px rgba(0,0,0,0.14);
      position: relative;
      overflow: hidden;
    }

    .s-barrel::before {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 16%;
      height: 12%;
      border-radius: 8px;
      background: rgba(67,70,75,0.8);
    }

    .s-barrel::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9%;
      width: 74%;
      height: 18%;
      transform: translateX(-50%);
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(92,95,100,0.82), rgba(27,30,33,0.96));
    }

    .s-tube-bank {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 66%;
      height: 18%;
      transform: translate(-50%, -50%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9%;
      z-index: 7;
    }

    .s-tube {
      background: linear-gradient(180deg, #f7595f 0%, var(--red-1) 30%, var(--red-2) 100%);
      border-radius: 999px;
      position: relative;
      box-shadow: inset 0 2px 8px rgba(255,255,255,0.18), inset 0 -5px 10px rgba(0,0,0,0.28), 0 0 10px rgba(255,95,110,0.2);
    }

    .s-tube::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12%;
      height: 64%;
      transform: translate(-50%, -50%);
      background: rgba(74,0,0,0.2);
      border-radius: 999px;
    }

    .s-tube::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 76%;
      height: 18%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
    }

    .s-strap {
      position: absolute;
      left: 50%;
      top: 71%;
      width: 42%;
      height: 9%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(38,41,44,0.9), rgba(17,19,22,0.98));
      border-radius: 8px;
      box-shadow: inset 0 3px 5px rgba(255,255,255,0.1), inset 0 -5px 6px rgba(0,0,0,0.2);
      z-index: 3;
    }

    .s-grip {
      position: absolute;
      left: 50%;
      bottom: 11%;
      width: 20%;
      height: 15%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(82,85,90,0.9), rgba(33,37,40,1));
      border-radius: 12px;
      box-shadow: inset 0 6px 10px rgba(255,255,255,0.12), inset 0 -10px 12px rgba(0,0,0,0.28), 0 10px 12px rgba(0,0,0,0.18);
      z-index: 2;
    }

    .s-trigger {
      position: absolute;
      left: 64%;
      top: 51%;
      width: 12px;
      height: 54px;
      background: linear-gradient(180deg, #656a70 0%, #2a2d30 100%);
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.45);
      transform: rotate(-18deg);
      box-shadow: inset 0 0 4px rgba(255,255,255,0.14);
      z-index: 10;
    }

    .s-screw-row {
      position: absolute;
      left: 50%;
      bottom: 11%;
      width: 56%;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      z-index: 9;
    }

    .s-screw {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #50565b 0%, #171b1d 35%, #090b0d 100%);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: inset 0 2px 2px rgba(255,255,255,0.18), 0 2px 3px rgba(0,0,0,0.22);
    }

    .s-shadow {
      position: absolute;
      left: 50%;
      bottom: 2%;
      width: 20%;
      height: 8%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(0,0,0,0.35), rgba(0,0,0,0.08) 62%, transparent 100%);
      filter: blur(10px);
      opacity: 0.7;
    }

    @media (max-width: 980px) {
      .page {
        grid-template-columns: 1fr;
      }
      .hud-panel { min-height: 520px; }
      .shooter-panel { min-height: 340px; }
      .bottom-bar { width: 85%; }
    }

    @media (max-width: 640px) {
      .page { padding: 12px; }
      .brand { letter-spacing: 0.14em; font-size: 8px; }
      .brand strong { font-size: 17px; }
      .bottom-bar {
        grid-template-columns: 1fr;
        width: 68%;
      }
      .side-panel { width: 150px; }
      .side-panel.left { left: 4%; }
      .side-panel.right { right: 4%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="panel hud-panel">
      <div class="brand">
        <span>Fabrication Network</span>
        <strong>FAB-01</strong>
      </div>

      <div class="scan-ring"></div>
      <div class="crosshair"></div>

      <div class="side-panel left">
        <div class="label">Core Status</div>
        <div class="stats">
          <div>Temp<strong>38°C</strong></div>
          <div>Power<strong>92%</strong></div>
        </div>
        <div class="meter"><span></span></div>
      </div>

      <div class="side-panel right">
        <div class="label">Cohesion</div>
        <div class="stats">
          <div>Mesh<strong>99.2</strong></div>
          <div>Sync<strong>88%</strong></div>
        </div>
        <div class="meter"><span style="width: 78%;"></span></div>
      </div>

      <div class="radar"></div>

      <div class="holo-body">
        <svg viewBox="0 0 260 520" aria-label="Fabricator body scan" role="img">
          <path class="glow" d="M128 42 L146 42 L150 66 L154 42 L172 42 L168 84 L175 126 L165 170 L175 206 L170 252 L182 310 L170 368 L186 450 L164 500 L148 500 L140 402 L126 500 L110 500 L94 448 L110 368 L96 310 L110 252 L104 206 L115 170 L104 126 L112 84 Z" />
          <path class="line" d="M111 72 L128 54 L146 72 L164 54 L182 72 M128 54 L128 86 M146 72 L146 86 M128 86 L118 120 L108 170 M146 86 L158 120 L171 170 M108 170 L88 238 L74 306 M171 170 L191 238 L206 304 M88 238 L86 334 L84 430 M206 304 L208 334 L210 430 M84 430 L108 468 M210 430 L184 468 M108 170 L128 214 L128 270 M171 170 L150 214 L150 270 M128 270 L122 342 L128 410 M150 270 L156 342 L150 410 M128 410 L106 470 M150 410 L172 470 M94 120 L68 140 M176 120 L202 140 M78 332 L52 350 M200 332 L228 350" />
          <circle class="line" cx="130" cy="48" r="18" />
          <circle class="glow" cx="130" cy="48" r="24" />
          <path class="line" d="M95 190 L72 184 M165 190 L188 184" />
          <path class="line" d="M118 214 L90 254 M142 214 L170 254" />
          <path class="line" d="M114 354 L90 430 M146 354 L170 430" />
          <path class="line" d="M128 302 L128 348 M150 302 L150 348" />
          <path class="line" d="M120 134 L98 148 M140 134 L162 148" />
        </svg>
      </div>

      <div class="bottom-bar">
        <div class="mini-box">
          <div>
            <span class="name">Material</span>
            <span class="value">Alloy 5</span>
          </div>
        </div>
        <div class="mini-box">
          <div>
            <span class="name">Forge</span>
            <span class="value">Online</span>
          </div>
        </div>
        <div class="mini-box">
          <div>
            <span class="name">Output</span>
            <span class="value">96%</span>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel shooter-panel">
      <div class="shooter-scene">
        <div class="s-body">
          <div class="s-frame"></div>
          <div class="s-plate"></div>
          <div class="s-strip top"></div>
          <div class="s-strip bottom"></div>

          <div class="s-bank">
            <div class="s-barrel"></div>
            <div class="s-barrel"></div>
            <div class="s-barrel"></div>
            <div class="s-barrel"></div>
          </div>

          <div class="s-tube-bank">
            <div class="s-tube"></div>
            <div class="s-tube"></div>
            <div class="s-tube"></div>
            <div class="s-tube"></div>
          </div>

          <div class="s-strap"></div>
          <div class="s-grip"></div>
          <div class="s-trigger"></div>

          <div class="s-screw-row">
            <div class="s-screw"></div>
            <div class="s-screw"></div>
            <div class="s-screw"></div>
            <div class="s-screw"></div>
            <div class="s-screw"></div>
            <div class="s-screw"></div>
          </div>

          <div class="s-shadow"></div>
        </div>
      </div>
    </aside>
  </div>
</body>
</html>
