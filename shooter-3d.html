<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Shooter 3D Model</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: rgba(12, 25, 40, 0.8);
      --line: rgba(125, 240, 255, 0.9);
      --text: #e8faff;
      --metal: #d4d4d8;
      --accent: #ff4d6d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(135deg, #0a0e14 0%, #1a2f3f 50%, #0a0e14 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      opacity: 0.5;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px;
      z-index: 2;
    }

    .viewport {
      position: relative;
      width: min(70%, 900px);
      height: 100%;
      background: radial-gradient(circle at center, rgba(30, 60, 90, 0.3), rgba(5, 10, 15, 0.8));
      border: 1px solid rgba(125, 240, 255, 0.25);
      box-shadow:
        inset 0 0 40px rgba(125, 240, 255, 0.08),
        0 0 40px rgba(125, 240, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .viewport::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(125, 240, 255, 0.12);
      pointer-events: none;
    }

    .shooter-3d {
      position: relative;
      width: 280px;
      height: 520px;
      perspective: 1200px;
      filter: drop-shadow(0 0 30px rgba(125, 240, 255, 0.3));
      transform: rotateX(8deg) rotateY(-12deg) rotateZ(5deg);
      transition: transform 0.4s ease;
    }

    .shooter-3d:hover {
      transform: rotateX(12deg) rotateY(-18deg) rotateZ(8deg);
    }

    /* Main cylinder body */
    .body {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 380px;
    }

    .barrel {
      position: absolute;
      left: 50%;
      top: 0;
      width: 120px;
      height: 140px;
      background: linear-gradient(90deg, #888 0%, #d4d4d8 25%, #888 50%, #d4d4d8 75%, #888 100%);
      border-radius: 60px 60px 40px 40px;
      transform: translateX(-50%);
      box-shadow:
        inset -8px 10px 20px rgba(0,0,0,0.4),
        inset 8px -10px 20px rgba(255,255,255,0.3),
        0 8px 16px rgba(0,0,0,0.6);
    }

    .nozzle {
      position: absolute;
      left: 50%;
      top: 12px;
      width: 60px;
      height: 30px;
      background: radial-gradient(ellipse at center, #e8e8e8, #888);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow:
        inset 0 -4px 8px rgba(0,0,0,0.5),
        0 0 12px rgba(125, 240, 255, 0.4);
    }

    .nozzle::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), transparent);
    }

    /* Mid section - main chamber */
    .chamber {
      position: absolute;
      left: 50%;
      top: 110px;
      width: 140px;
      height: 180px;
      background: linear-gradient(90deg, #666 0%, #999 20%, #555 50%, #999 80%, #666 100%);
      border-radius: 20px;
      transform: translateX(-50%);
      box-shadow:
        inset -12px 12px 28px rgba(0,0,0,0.5),
        inset 12px -12px 28px rgba(255,255,255,0.2),
        0 12px 28px rgba(0,0,0,0.7);
    }

    .chamber::before {
      content: "";
      position: absolute;
      top: 15px;
      left: 10px;
      right: 10px;
      height: 40px;
      background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent);
      border-radius: 15px;
    }

    .fluid-tank {
      position: absolute;
      left: 8%;
      top: 20px;
      width: 20%;
      height: 160px;
      background: linear-gradient(90deg, #1a1a1a 0%, #333 50%, #1a1a1a 100%);
      border-radius: 8px;
      box-shadow:
        inset -4px 4px 12px rgba(0,0,0,0.7),
        inset 4px -4px 12px rgba(255,255,255,0.15),
        0 4px 12px rgba(0,0,0,0.8);
    }

    .fluid-liquid {
      position: absolute;
      left: 3px;
      top: 20px;
      width: calc(100% - 6px);
      height: 75%;
      background: linear-gradient(135deg, #ff6b9d 0%, #ff1744 50%, #c2185b 100%);
      border-radius: 6px;
      opacity: 0.85;
      box-shadow: inset -2px 2px 8px rgba(0,0,0,0.4);
    }

    .tank-indicator {
      position: absolute;
      left: 50%;
      top: 25px;
      width: 35%;
      height: 4px;
      background: rgba(125, 240, 255, 0.2);
      border-radius: 2px;
      transform: translateX(-50%);
    }

    .tank-indicator::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 88%;
      height: 100%;
      background: linear-gradient(90deg, rgba(125, 240, 255, 0.4), rgba(125, 240, 255, 0.8));
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(125, 240, 255, 0.6);
    }

    .strap {
      position: absolute;
      left: 50%;
      top: 145px;
      width: 130px;
      height: 12px;
      background: linear-gradient(90deg, #222 0%, #555 50%, #222 100%);
      border-radius: 6px;
      transform: translateX(-50%);
      box-shadow: inset -2px 2px 8px rgba(0,0,0,0.6);
    }

    .strap::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 2px;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), #555);
      border-radius: 50%;
      box-shadow: 20px 0 0 #555, 100px 0 0 #555;
    }

    .grip {
      position: absolute;
      left: 50%;
      top: 270px;
      width: 110px;
      height: 120px;
      background: linear-gradient(90deg, #3a3a3a 0%, #555 25%, #3a3a3a 50%, #555 75%, #3a3a3a 100%);
      border-radius: 14px;
      transform: translateX(-50%);
      box-shadow:
        inset -6px 6px 16px rgba(0,0,0,0.6),
        inset 6px -6px 16px rgba(255,255,255,0.15),
        0 8px 20px rgba(0,0,0,0.7);
    }

    .grip::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      right: 3px;
      bottom: 3px;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 6px,
        rgba(255,255,255,0.05) 6px,
        rgba(255,255,255,0.05) 8px
      );
      border-radius: 12px;
    }

    .trigger {
      position: absolute;
      left: 65%;
      top: 240px;
      width: 24px;
      height: 60px;
      background: linear-gradient(90deg, #444 0%, #666 50%, #444 100%);
      border-radius: 4px;
      transform: rotateZ(-18deg);
      box-shadow:
        inset -2px 2px 8px rgba(0,0,0,0.7),
        0 4px 12px rgba(0,0,0,0.8);
      transition: transform 0.1s ease;
    }

    .trigger:hover {
      transform: rotateZ(-22deg);
      box-shadow:
        inset -2px 2px 8px rgba(0,0,0,0.7),
        0 4px 12px rgba(0,0,0,0.8),
        0 0 16px rgba(255, 77, 109, 0.4);
    }

    .casing {
      position: absolute;
      left: 50%;
      top: 350px;
      width: 160px;
      height: 40px;
      background: linear-gradient(90deg, #888 0%, #b8b8b8 25%, #888 50%, #b8b8b8 75%, #888 100%);
      border-radius: 8px;
      transform: translateX(-50%);
      box-shadow:
        inset -6px 4px 12px rgba(0,0,0,0.5),
        inset 6px -4px 12px rgba(255,255,255,0.3),
        0 6px 16px rgba(0,0,0,0.7);
    }

    .casing::before,
    .casing::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), #666);
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: inset -1px -1px 4px rgba(0,0,0,0.8);
    }

    .casing::before { left: 12px; }
    .casing::after { right: 12px; }

    .control-panel {
      position: absolute;
      right: 0;
      top: 0;
      width: min(28%, 320px);
      height: 100%;
      background: linear-gradient(180deg, rgba(10, 22, 35, 0.9), rgba(5, 15, 25, 0.95));
      border-left: 1px solid rgba(125, 240, 255, 0.3);
      padding: 20px 16px;
      overflow-y: auto;
      box-shadow: inset 8px 0 24px rgba(125, 240, 255, 0.04);
    }

    .control-panel::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(125, 240, 255, 0.12);
      pointer-events: none;
    }

    .control-section {
      position: relative;
      z-index: 2;
      margin-bottom: 22px;
    }

    .control-title {
      font-size: 9px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(208, 235, 255, 0.76);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-title::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #7df9ff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(125, 249, 255, 0.8);
    }

    .param {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 9px;
      letter-spacing: 0.16em;
      color: rgba(208, 235, 255, 0.72);
      text-transform: uppercase;
    }

    .param .value {
      color: var(--text);
      font-weight: 600;
      text-shadow: 0 0 8px rgba(125, 240, 255, 0.6);
    }

    .slider {
      width: 100%;
      height: 4px;
      background: rgba(125, 240, 255, 0.15);
      border-radius: 2px;
      position: relative;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .slider::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 65%;
      height: 100%;
      background: linear-gradient(90deg, rgba(125, 240, 255, 0.3), rgba(125, 240, 255, 0.8));
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(125, 240, 255, 0.6);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .stat-box {
      background: rgba(12, 30, 45, 0.8);
      border: 1px solid rgba(125, 240, 255, 0.22);
      padding: 10px 8px;
      text-align: center;
      border-radius: 4px;
      font-size: 8px;
      letter-spacing: 0.18em;
      color: rgba(208, 235, 255, 0.7);
      text-transform: uppercase;
    }

    .stat-box .num {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      color: var(--text);
      font-weight: 600;
      text-shadow: 0 0 10px rgba(125, 240, 255, 0.7);
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      padding: 10px 8px;
      background: rgba(12, 30, 45, 0.7);
      border: 1px solid rgba(125, 240, 255, 0.28);
      color: rgba(208, 235, 255, 0.8);
      font-size: 8px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s ease;
      border-radius: 3px;
    }

    .btn:hover {
      background: rgba(12, 30, 45, 0.95);
      border-color: rgba(125, 240, 255, 0.6);
      box-shadow: 0 0 12px rgba(125, 240, 255, 0.2);
      color: var(--text);
    }

    .btn.fire {
      grid-column: 1 / -1;
      background: rgba(255, 77, 109, 0.12);
      border-color: rgba(255, 77, 109, 0.4);
      color: rgba(255, 77, 109, 0.9);
    }

    .btn.fire:hover {
      background: rgba(255, 77, 109, 0.25);
      border-color: rgba(255, 77, 109, 0.8);
      box-shadow: 0 0 16px rgba(255, 77, 109, 0.3);
      color: #ff6b9d;
    }

    @media (max-width: 1200px) {
      .container {
        flex-direction: column;
        padding: 16px;
      }
      .viewport {
        width: 100%;
        height: 60vh;
      }
      .control-panel {
        position: static;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(125, 240, 255, 0.3);
        height: 40vh;
      }
    }

    .scrollbar-hide::-webkit-scrollbar {
      width: 6px;
    }

    .scrollbar-hide::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollbar-hide::-webkit-scrollbar-thumb {
      background: rgba(125, 240, 255, 0.15);
      border-radius: 3px;
    }

    .scrollbar-hide::-webkit-scrollbar-thumb:hover {
      background: rgba(125, 240, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="viewport">
      <div class="shooter-3d">
        <div class="body">
          <div class="barrel">
            <div class="nozzle"></div>
          </div>
          <div class="chamber">
            <div class="fluid-tank">
              <div class="fluid-liquid"></div>
            </div>
          </div>
          <div class="tank-indicator"></div>
          <div class="strap"></div>
          <div class="trigger"></div>
          <div class="grip"></div>
          <div class="casing"></div>
        </div>
      </div>
    </div>

    <div class="control-panel scrollbar-hide">
      <div class="control-section">
        <div class="control-title">Shooter Stats</div>
        <div class="stat-grid">
          <div class="stat-box">
            <div>Tension</div>
            <div class="num">82%</div>
          </div>
          <div class="stat-box">
            <div>Fire Rate</div>
            <div class="num">980 RPM</div>
          </div>
          <div class="stat-box">
            <div>Range</div>
            <div class="num">1.8km</div>
          </div>
          <div class="stat-box">
            <div>Charge</div>
            <div class="num">97%</div>
          </div>
        </div>
      </div>

      <div class="control-section">
        <div class="control-title">Fluid Tank</div>
        <div class="param">
          <span>Capacity</span>
          <span class="value">420ml</span>
        </div>
        <div class="slider"></div>
        <div class="param">
          <span>Type</span>
          <span class="value">Aqua Silk</span>
        </div>
        <div class="param">
          <span>Viscosity</span>
          <span class="value">7.2 cSt</span>
        </div>
      </div>

      <div class="control-section">
        <div class="control-title">Performance</div>
        <div class="param">
          <span>Velocity</span>
          <span class="value">420 m/s</span>
        </div>
        <div class="param">
          <span>Adhesion</span>
          <span class="value">99.2%</span>
        </div>
        <div class="param">
          <span>Tensile Str.</span>
          <span class="value">2.8 GPa</span>
        </div>
      </div>

      <div class="control-section">
        <div class="control-title">Controls</div>
        <div class="button-group">
          <button class="btn">Calibrate</button>
          <button class="btn">Diagnose</button>
          <button class="btn fire">Fire Test</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
